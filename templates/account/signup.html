{% extends 'base.html' %}
{% load static %}

{% block title %}회원가입 - KITUP{% endblock %}

{% block header %}
    <link rel="stylesheet" href="{% static 'css/signup.css' %}">
{% endblock %}

{% block content %}
    <div class="container">
        <!-- 회원가입 카드 -->
        <div class="signup-card">
            <!-- 제목 -->
            <h1 class="title">회원가입</h1>

            <!-- 폼  -->
            <form class="signup-form">
                <!-- 아이디 입력 -->
                <div class="form-group">
                    <label class="label">아이디</label>
                    <div class="input-wrapper">
                        <input type="text" class="input" placeholder="아이디">
                        <button type="button" class="check-btn">확인</button>
                    </div>
                </div>

                <!-- 비밀번호 입력 -->
                <div class="form-group">
                    <label class="label">비밀번호</label>
                    <input type="password" class="input" placeholder="비밀번호">
                </div>

                <!-- 비밀번호 확인 입력 -->
                <div class="form-group">
                    <input type="password" class="input" placeholder="비밀번호 확인">
                </div>

                <!-- 이메일 입력 -->
                <div class="form-group">
                    <label class="label">이메일</label>
                    <input type="email" class="input" placeholder="이메일">
                </div>

                <!-- 전화번호 입력 -->
                <div class="form-group">
                    <label class="label">전화번호 인증</label>
                    <div class="input-wrapper">
                        <input type="tel" class="input" placeholder="전화번호 인증">
                        <button type="button" class="check-btn">확인</button>
                    </div>
                </div>

                <!-- 회원가입 완료 -->
                <button type="submit" class="submit-btn">회원가입</button>
            </form>
        </div>
    </div>
{% endblock %}
