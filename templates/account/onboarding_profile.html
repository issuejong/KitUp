<h1>{% if user.nickname %}프로필 수정{% else %}프로필 설정{% endif %}</h1>

<form method="post" enctype="multipart/form-data">
  {% csrf_token %}

  <div>
    {{ form.nickname.errors }}
    {{ form.nickname.label_tag }} {{ form.nickname }}
  </div>

  <div>
    {{ form.profile_image.errors }}
    {{ form.profile_image.label_tag }} {{ form.profile_image }}
  </div>

  <button type="submit">=
    {% if user.nickname %}수정{% else %}저장{% endif %}
  </button>
</form>
