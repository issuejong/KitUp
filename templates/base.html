{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}KITUP{% endblock %}</title>
    <link rel="stylesheet" href="base.css">
    {% block header %}{% endblock %}
</head>
<body>
    <header>
        <a href="/">
            <h3>KITUP</h3>
        </a>
        <div class="header_menu">
            {% if user.is_authenticated %}
                <a href="{% url 'game:create_game' %}"><p>팀매칭</p></a>
                <a href="{% url 'game:ranking' %}"><p>내 프로젝트</p></a>
                <a href="{% url 'game:ranking' %}"><p>프로젝트 기록</p></a>
                <a href="{% url 'game:ranking' %}"><p>마이페이지</p></a>
                <a href="/accounts/logout/"><p>로그아웃</p></a>
            {% else %}
                <a href="/accounts/login/"><p>로그인</p></a>
                <a href="/accounts/signup/"><p>회원가입</p></a>
            {% endif %}
        </div>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer></footer>
</body>
</html>
